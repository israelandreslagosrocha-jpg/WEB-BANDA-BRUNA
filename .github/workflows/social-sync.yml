name: Sincronización Automática de Redes Sociales

on:
  schedule:
    # Una sola consulta diaria; Vercel ya no tiene cron social.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo extraer y validar; no guardar datos'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: social-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Extraer y guardar métricas públicas
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Leer el código del recolector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Consultar redes desde el runner y enviar resultados
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run_social_sync.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
