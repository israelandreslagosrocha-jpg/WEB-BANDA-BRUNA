name: Sincronización Automática de Redes Sociales

on:
  schedule:
    # Ejecución 3 veces al día:
    # 12:00 UTC = 09:00 AM Chile (Mañana)
    # 18:00 UTC = 15:00 PM Chile (Tarde)
    # 00:00 UTC = 21:00 PM Chile (Noche)
    - cron: '0 0,12,18 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  sync:
    name: Sincronizar Métricas y Redes
    runs-on: ubuntu-latest
    steps:
      - name: Llamar Endpoint de Sincronización
        run: |
          echo "Iniciando sincronización programada..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://www.bandabruna.cl/api/cron/sync-social" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || '3ab319b9e61b8f0767f1d60c3953efb1f81301f3abe6ce99bac8c1927c2f143f' }}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Respuesta: $HTTP_BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: La sincronización respondió con código $HTTP_CODE"
            exit 1
          fi
          echo "Sincronización completada exitosamente."
