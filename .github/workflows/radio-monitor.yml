name: Monitor radial

on:
  schedule:
    # Cada 30 minutos, evitando el minuto 00 donde GitHub suele tener mayor carga.
    - cron: '7,37 * * * *'
  workflow_dispatch:

# El workflow solo invoca la API; no necesita acceso al repositorio ni permisos de GitHub.
permissions: {}

# Evita que dos ejecuciones programadas se solapen si una demora más de lo previsto.
concurrency:
  group: radio-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Consultar radios
    # Fijamos la imagen para evitar que un cambio automático de ubuntu-latest
    # altere el comportamiento del monitor.
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Invocar el escaneo protegido
        env:
          # La tarea programada siempre consulta producción. No es un secreto y
          # evitar una variable adicional impide que el job falle por omisión.
          RADIO_SCAN_URL: https://www.bandabruna.cl
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "Falta CRON_SECRET en los secretos del repositorio de GitHub Actions." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          set +e
          http_code="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-connrefused \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${RADIO_SCAN_URL%/}/api/radio/scan")"
          curl_exit=$?
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "No se pudo conectar con el endpoint de radio (curl exit $curl_exit)." >&2
            exit "$curl_exit"
          fi

          echo "HTTP Status: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "El endpoint de radio rechazó la solicitud. Respuesta:" >&2
            tr '\n' ' ' < "$response_file" | cut -c1-1000 >&2
            echo >&2
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1]) as file:
              data = json.load(file)
          if data.get('success') is not True:
              raise SystemExit('El endpoint no confirmó un escaneo correcto')
          print('Radios procesadas:', data.get('processed', 0))
          print('Peticiones de metadata:', data.get('requests', 'no informado'))
          print('Resumen:', json.dumps(data.get('summary', {}), ensure_ascii=False))
          if data.get('partial'):
              print('::warning::Escaneo parcial: algunas fuentes no entregan canciones verificables. Revisar diagnóstico.')
          # Un job verde no implica que todas las emisoras entregaron metadata.
          for result in data.get('results', []):
              # JSON mantiene saltos y caracteres externos escapados; nunca imprime URLs o secretos.
              print(json.dumps({key: result.get(key) for key in ('radio', 'status', 'artist', 'track', 'error')}, ensure_ascii=True))
          PY
